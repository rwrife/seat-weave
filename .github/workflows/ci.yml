name: Pinned iOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    # Compact, large-text and regular-width suites each run on real simulators.
    # Run 39743069450 attempt 3 reached regular-width compilation at minute 36
    # after both earlier suites passed, then hit the 38-minute step limit.
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run pinned simulator validation
        timeout-minutes: 55
        run: Scripts/ci.sh "$TARGET_SHA"

      - name: Upload results and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-ci-${{ env.TARGET_SHA }}
          path: build/ci-artifacts
          if-no-files-found: warn
          retention-days: 14
